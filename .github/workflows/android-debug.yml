name: Android debug build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate icon library (SVG rules, manifest, generated files)
        run: python3 tools/icons/build_icons.py --check

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mono-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------- final "MONO" build
      - name: Restore MONO signing key (if configured)
        env:
          MONO_KEYSTORE_BASE64: ${{ secrets.MONO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MONO_KEYSTORE_BASE64" ]; then
            echo "$MONO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mono-release.jks"
            echo "MONO_KEYSTORE_PATH=$RUNNER_TEMP/mono-release.jks" >> "$GITHUB_ENV"
            echo "Signing the final APK with the MONO release key."
          else
            echo "::warning::MONO signing secrets not set; the final APK is signed with a temporary key (updates will need a reinstall)."
          fi

      - name: Assemble final MONO APK (release, R8-optimised)
        env:
          MONO_KEYSTORE_PASSWORD: ${{ secrets.MONO_KEYSTORE_PASSWORD }}
          MONO_KEY_ALIAS: ${{ secrets.MONO_KEY_ALIAS }}
          MONO_KEY_PASSWORD: ${{ secrets.MONO_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PmonoVersionName=1.0.${{ github.run_number }} -PmonoVersionCode=${{ github.run_number }}
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          "${BUILD_TOOLS}apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -n 3
          cp app/build/outputs/apk/release/app-release.apk "MONO-1.0.${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/mono-release.jks"

      - name: Upload final MONO APK
        uses: actions/upload-artifact@v4
        with:
          name: MONO-final-${{ github.run_number }}
          path: MONO-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
